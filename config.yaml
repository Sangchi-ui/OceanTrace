project:
  name: "OceanTrace - Agent 1 SAR Oil Spill Detection"
  version: "1.0.0"

model:
  architecture: "smp_unet"
  encoder_name: "efficientnet-b0"
  input_channels: 2
  num_classes: 1
  features: [32, 64, 128, 256]
  classification_head: true

preprocessing:
  target_size: [256, 256]
  normalize: true

postprocessing:
  probability_threshold: 0.63
  morphology_kernel_size: 3
  min_region_pixels: 50
  remove_small_objects: true

training:
  batch_size: 16
  learning_rate: 0.001
  epochs: 80
  positive_class_weight: 10.0
  positive_crop_probability: 0.75
  mask_format: "binary"
  validation_threshold: 0.655
  weight_decay: 0.0001
  checkpoint_dir: "models/checkpoints"
  best_model_path: "models/unet_oil_spill.pth"
  seed: 42
  num_workers: 0
  resume: false
  latest_checkpoint_path: "models/checkpoints/latest.pt"
  patience: 10
  min_delta: 0.001
  bce_weight: 0.5
  tversky_weight: 0.5
  tversky_alpha: 0.8
  tversky_beta: 0.3
  classification_loss_weight: 1.0
  clean_accuracy_target: 0.85
  speckle_noise_probability: 0.25
  intensity_jitter_probability: 0.25
  cache_dir: "data/cache/sar"

geospatial:
  default_crs: "EPSG:4326"

validation:
  min_area_km2: 0.001
  max_area_km2: 5000.0
  min_confidence: 0.3
